{% extends 'base.html' %}

{% block title %}500 Internal Server Error - EMP{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-5 shadow-sm border-danger">
                <div class="stat-icon bg-danger bg-opacity-10 text-danger mx-auto mb-3" style="width: 64px; height: 64px; font-size: 2rem;">
                    <i class="bi bi-exclamation-triangle-fill"></i>
                </div>
                <h2 class="fw-bold text-danger">500 - Internal Server Error</h2>
                <p class="text-muted mb-4">An unexpected error occurred while processing your request. Please try again later.</p>
                <div>
                    <a href="{{ url_for('main.index') }}" class="btn btn-primary">
                        <i class="bi bi-house me-1"></i> Return Home
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% extends 'base.html' %}

{% block title %}404 Not Found - Examination Management Portal{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-5 shadow-sm">
                <div class="stat-icon bg-warning bg-opacity-10 text-warning mx-auto mb-3" style="width: 64px; height: 64px; font-size: 2rem;">
                    <i class="bi bi-question-circle"></i>
                </div>
                <h2 class="fw-bold">404 - Page Not Found</h2>
                <p class="text-muted mb-4">The requested resource or endpoint could not be found.</p>
                <div>
                    <a href="{{ url_for('main.index') }}" class="btn btn-primary">
                        <i class="bi bi-house me-1"></i> Return Home
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
